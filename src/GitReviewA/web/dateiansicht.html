<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gitreviewA — Dateiansicht</title>
<link rel="stylesheet" href="kd-tokens.css">
<link rel="stylesheet" href="kd-base.css">
<link rel="stylesheet" href="gitreviewa.css">
<link rel="stylesheet" href="dateiansicht.css">
<script src="umbruch-werte.js" defer></script>
<script src="tasten-werte.js" defer></script>
<script src="farbe-werte.js" defer></script>
<script src="farbschlange.js" defer></script>
<script src="dateiliste-werte.js" defer></script>
<script src="dateiansicht-werte.js" defer></script>
<script src="trenner-werte.js" defer></script>
<script src="einklappen-werte.js" defer></script>
<script src="bereich-werte.js" defer></script>
<script src="suche-werte.js" defer></script>
<script src="kopieren.js" defer></script>
<script src="hinweise.js" defer></script>
<script src="trenner.js" defer></script>
<script src="einklappen.js" defer></script>
<script src="hilfe.js" defer></script>
<script src="suche.js" defer></script>
<script src="dateiansicht.js" defer></script>
</head>
<body>
<!-- Kopf (R00043): Angabe, echter Pfad, Größe, Zeilen, Kodierung, Zeilenende, „Datei kopieren“, „Schließen“; höchstens zwei Zeilen. -->
<header id="da-kopf" class="da-kopf" aria-label="Datei" data-hilfe-hintergrund>
  <div class="da-kopf-zeile">
    <h1 id="da-name" class="da-name mono"></h1>
    <p id="da-pfad" class="da-pfad mono"></p>
    <div class="da-knoepfe">
      <button type="button" id="datei-kopieren" class="btn">Datei kopieren</button>
      <button type="button" id="hilfe-knopf" class="btn">Kürzel</button>
      <button type="button" id="schliessen" class="btn">Schließen</button>
    </div>
  </div>
  <div class="da-kopf-zeile da-kopf-werte">
    <span id="da-werte" class="da-werte"></span>
    <span id="da-hinweis" class="da-hinweis" role="status"></span>
    <label class="ru-sch da-umbruch-schalter"><input type="checkbox" role="switch" class="umbruch-schalter" id="da-umbruch" checked>Umbruch</label>
  </div>
</header>
<!-- Seitenleiste (R00045): je Datei eine Zeile in Aufrufreihenfolge; dieselbe Mechanik wie im Review (R00033–R00035) über
     `trenner.js`/`einklappen.js`. Die Breite und das Einklappen wirken allein über das Layout — der Inhalt wird nicht neu gezeichnet. -->
<div class="gr-ansicht da-ansicht">
  <aside id="seitenleiste" class="gr-links da-links" aria-label="Dateien">
    <p id="da-leiste-status" class="gr-status" role="status"></p>
    <ul id="da-dateien" class="gr-dateien da-dateien" aria-label="Dateien der Ansicht"></ul>
  </aside>
  <div class="gr-streifen"></div>
  <main id="diff" class="gr-diff da-haupt" aria-label="Dateiinhalt" data-hilfe-hintergrund>
    <!-- Werkzeugleiste (R00044): Suche, markierter Bereich und „Bereich kopieren“ in einer Zeile. -->
    <div id="da-werkzeug" class="da-werkzeug">
      <label class="da-suche-feld"><span class="da-suche-label">Suchen</span>
        <input type="search" id="da-suche" class="da-suche formularfeld" autocomplete="off" spellcheck="false" aria-describedby="da-suche-fehler">
      </label>
      <span class="da-suche-zaehler" role="status" aria-live="polite"></span>
      <span id="da-suche-fehler" class="da-suche-fehler gr-status fehler" role="alert"></span>
      <span id="da-markierung" class="da-markierung" role="status"></span>
      <button type="button" id="bereich-kopieren" class="btn" disabled>Bereich kopieren</button>
    </div>
    <p id="da-status" class="da-status" role="status"></p>
    <p id="da-ansage" class="vh" aria-live="polite" aria-atomic="true"></p>
    <div id="da-roll" class="da-roll" tabindex="0" role="region" aria-label="Dateiinhalt">
      <p id="da-meldung" class="da-meldung"></p>
      <div id="da-inhalt" class="da-inhalt umbr"></div>
    </div>
    <div id="da-fuss" class="da-fuss" data-hilfe-hintergrund>
      <p class="da-schliessen-hinweis muted">„Schließen“ beendet die Ansicht; das Ergebnis bleibt leer.</p>
    </div>
  </main>
</div>
<!-- Hilfe-Overlay (R00030): dieselbe Übersicht wie im Review, aus dem Katalog (`tasten-werte.js`) mit der Laufart Dateiansicht. -->
<div id="hilfe-scrim" class="hilfe-scrim" hidden></div>
<div id="hilfe" class="hilfe" role="dialog" aria-modal="true" aria-labelledby="h-hilfe" hidden>
  <h2 id="h-hilfe">Tastaturkürzel</h2>
  <button type="button" id="hilfe-zu" class="btn btn-sym zu" aria-label="Kürzel schließen">×</button>
  <div class="hilfe-inhalt"></div>
</div>
</body>
</html>
